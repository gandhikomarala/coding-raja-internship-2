<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundPulse — Audio Player & Visualizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #030712; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .player-card { background: #111827; border: 1px solid #1f2937; border-radius: 24px; padding: 36px; width: min(90vw, 480px); text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.8); }
    .album-art { width: 180px; height: 180px; border-radius: 20px; background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%); margin: 0 auto 24px auto; display: flex; align-items: center; justify-content: center; font-size: 64px; box-shadow: 0 10px 30px rgba(236,72,153,0.4); }
    .track-title { font-size: 22px; font-weight: 800; color: #f8fafc; }
    .track-artist { font-size: 14px; color: #94a3b8; margin-top: 4px; }
    .visualizer-bars { display: flex; justify-content: center; align-items: flex-end; height: 60px; gap: 6px; margin: 24px 0; }
    .bar { width: 8px; background: #38bdf8; border-radius: 4px; height: 15px; transition: height 0.1s; }
    .controls { display: flex; justify-content: center; gap: 20px; align-items: center; }
    .btn-ctrl { background: #1f2937; border: none; color: #fff; width: 50px; height: 50px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-play { width: 64px; height: 64px; background: #38bdf8; color: #000; font-size: 24px; }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="album-art">🎧</div>
    <div class="track-title" id="track-name">Cyberpunk Synthesizer Echoes</div>
    <div class="track-artist">Neon Horizon Studio</div>

    <div class="visualizer-bars" id="bars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div class="controls">
      <button class="btn-ctrl" onclick="prev()">⏮</button>
      <button class="btn-ctrl btn-play" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="btn-ctrl" onclick="next()">⏭</button>
    </div>
  </div>
  <script>
    let isPlaying = false;
    let timer = null;
    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('play-btn').innerText = isPlaying ? '⏸' : '▶';
      if (isPlaying) {
        timer = setInterval(() => {
          document.querySelectorAll('.bar').forEach(b => {
            b.style.height = `${Math.floor(Math.random() * 55) + 10}px`;
          });
        }, 100);
      } else {
        clearInterval(timer);
        document.querySelectorAll('.bar').forEach(b => b.style.height = '15px');
      }
    }
  </script>
</body>
</html>
